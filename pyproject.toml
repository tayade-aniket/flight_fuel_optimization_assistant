[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerofuel-ai"
version = "1.0.0"
description = "Explainable Flight Fuel Optimization & Decision Support Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "shap",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "joblib>=1.4.0",
    "aiofiles>=23.0.0",
    "plotly",
    "pyarrow",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
